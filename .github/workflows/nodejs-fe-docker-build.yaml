name: Reusable Node.js Frontend Docker Build & Push

on:
  workflow_call:
    inputs:
      nodejs_version:
        required: true
        type: string
        description: "Target Node.js runtime version (e.g., 18, 20, 22)"
      description:
        description: "Description of the application"
        required: false
        type: string
      base_image:
        description: "Override base runtime image (defaults to nginx:alpine)"
        required: false
        type: string
      build_command:
        description: "Override the npm build command (defaults to 'npm run build')"
        required: false
        type: string
        default: "npm run build"
      build_output_dir:
        description: "Directory containing the compiled static assets (defaults to 'dist')"
        required: false
        type: string
        default: "dist"
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
      disable_sonarqube:
        description: "Disable SonarQube Scan"
        type: boolean
        default: true
      disable_snyk:
        description: "Disable Snyk Scan"
        type: boolean
        default: true
      ecr_repository:
        description: "Override ECR repository name (defaults to the GitHub repo name)"
        required: false
        type: string
    outputs:
      image:
        description: "The built container image tag"
        value: ${{ jobs.build-and-push.outputs.image }}
      digest:
        description: "The immutable image digest"
        value: ${{ jobs.build-and-push.outputs.digest }}

permissions:
  id-token: write
  contents: read

jobs:
  # 1. Pipeline Initialization & Variable Setup
  init:
    runs-on: devops-end2end-runners
    outputs:
      project_name: ${{ steps.vars.outputs.PROJECT_NAME }}
      version: ${{ steps.vars.outputs.VERSION }}
      base_image: ${{ steps.vars.outputs.BASE_IMAGE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.nodejs_version }}"
          cache: "npm"

      - name: Calculate and Validate Environment Variables
        id: vars
        shell: bash
        run: |
          PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_NAME="${GITHUB_REF_NAME}"

          # Extract version from package.json, defaulting to 0.1 if missing
          if [ -f package.json ]; then
            RAW_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1")
          else
            RAW_VERSION="0.1"
          fi

          # Fail immediately if version is missing or unparseable
          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "undefined" ]; then
            echo "::error::Missing or invalid version in package.json. Platform compliance requires an explicit version defined in MAJOR.MINOR format (e.g., \"version\": \"0.1\"). Please update your package.json."
            exit 1
          fi

          # Enforce strict MAJOR.MINOR standard (fail build if revision/patch number like 0.1.0 is provided)
          IFS='.' read -r -a VERSION_PARTS <<< "$RAW_VERSION"
          if [ "${#VERSION_PARTS[@]}" -gt 2 ]; then
            echo "::error::Invalid version format '${RAW_VERSION}' detected in package.json. Platform compliance requires version to be strictly MAJOR.MINOR (e.g., '0.1'). Revision numbers (like '0.1.0') are managed automatically by the build engine. Please update your package.json version."
            exit 1
          fi

          MAJOR_MINOR="$RAW_VERSION"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}"
          else
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}-${BRANCH_NAME//\//-}"
          fi

          # Default to nginx:alpine for serving the compiled static assets
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_IMAGE="${{ inputs.base_image }}"
          else
            BASE_IMAGE="nginx:alpine"
          fi

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BASE_IMAGE=$BASE_IMAGE" >> $GITHUB_OUTPUT

  # 2. Unit Tests
  unit-tests:
    needs: init
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.nodejs_version }}"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test

      - name: Upload Test Coverage Artifact
        if: ${{ inputs.disable_sonarqube == false }}
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-fe-build-artifacts
          path: |
            coverage/lcov.info

  # 3. SonarQube Scan (Conditional)
  sonar-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_sonarqube == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nodejs-fe-build-artifacts

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=admarketplace_${{ needs.init.outputs.project_name }}
            -Dsonar.projectName=${{ needs.init.outputs.project_name }}
            -Dsonar.projectVersion=${{ needs.init.outputs.version }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.*,**/*.spec.*
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.organization=admarketplace

  # 4. Snyk Security Scan (Conditional)
  snyk-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_snyk == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.nodejs_version }}"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Snyk Open Source Security Test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 5. Build Static Assets & Push Docker Image to ECR
  build-and-push:
    needs: [init, unit-tests]
    runs-on: devops-end2end-runners
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-output.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.nodejs_version }}"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Assets
        run: ${{ inputs.build_command }}

      - name: Ensure Dockerfile Exists
        shell: bash
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No local Dockerfile found. Baking multi-stage Node.js/nginx default into the workspace..."
            cat << "EOF" > Dockerfile
          # ==========================================
          # Stage 1: Build static assets via Node.js
          # ==========================================
          FROM node:${{ inputs.nodejs_version }}-alpine AS builder
          WORKDIR /build
          COPY package*.json ./
          RUN npm ci
          COPY . .
          RUN ${{ inputs.build_command }}

          # ==========================================
          # Stage 2: Minimal nginx Runtime Image
          # ==========================================
          FROM ${{ needs.init.outputs.base_image }} AS runtime

          LABEL com.datadoghq.tags.service=${{ needs.init.outputs.project_name }}
          LABEL com.datadoghq.tags.version=${{ needs.init.outputs.version }}

          ENV DD_SERVICE=${{ needs.init.outputs.project_name }}
          ENV DD_VERSION=${{ needs.init.outputs.version }}

          # Remove default nginx static assets
          RUN rm -rf /usr/share/nginx/html/* /etc/nginx/conf.d/default.conf

          # Copy compiled frontend from the builder stage
          COPY --from=builder /build/${{ inputs.build_output_dir }} /usr/share/nginx/html

          # Copy custom nginx configuration
          COPY nginx.conf /etc/nginx/conf.d/default.conf

          # Allow nginx to run as non-root
          RUN chown -R nginx:nginx /usr/share/nginx/html && \
              chmod -R 755 /usr/share/nginx/html

          EXPOSE 8000
          CMD ["nginx", "-g", "daemon off;"]
          EOF
          else
            echo "Local Dockerfile found. Bypassing baked-in fallback."
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: "arn:aws:iam::932399238655:role/github-actions-ecr-role"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker-container

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.ecr_repository || needs.init.outputs.project_name }}
          cache-to: type=gha,scope=${{ inputs.ecr_repository || needs.init.outputs.project_name }},mode=min

      - name: Set Image Output
        id: build-output
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}
        run: |
          echo "image=${IMAGE_NAME}:${{ needs.init.outputs.version }}" >> "$GITHUB_OUTPUT"

      # Generate the SBOM from the exact immutable image digest pushed to ECR.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build-output.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          artifact-name: sbom-${{ needs.init.outputs.project_name }}-${{ needs.init.outputs.version }}.cdx.json
          upload-release-assets: false

      # Install Cosign and use GitHub's OIDC identity for keyless signing.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attach signed SBOM attestation
        shell: bash
        env:
          IMAGE: ${{ steps.build-output.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}@${DIGEST}"

          # Sign the immutable image digest, not a mutable tag.
          cosign sign --yes "$IMAGE_REF"

          # Attach the CycloneDX SBOM as a signed in-toto attestation.
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "$IMAGE_REF"
