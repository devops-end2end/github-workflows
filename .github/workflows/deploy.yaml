name: Deploy to Argo CD

on:
  workflow_call:
    inputs:
      image:
        description: Docker image URI
        required: true
        type: string

    secrets:
      ARGOCD_AUTH_TOKEN:
        description: Argo CD authentication token
        required: true

jobs:
  deploy:
    runs-on: devops-end2end-runners

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Argo CD CLI
        run: |
          if ! command -v argocd &> /dev/null; then
            echo "Installing Argo CD CLI..."
            curl -sSL -o /tmp/argocd \
              https://github.com/argoproj/argo-cd/releases/download/v3.5.0/argocd-linux-amd64

            chmod +x /tmp/argocd
            sudo mv /tmp/argocd /usr/local/bin/argocd
          else
            echo "Argo CD CLI is already installed on the runner."
          fi

      - name: Debug Argo CD Auth
        env:
          ARGOCD_SERVER: "argocd-server.argocd.svc.cluster.local:80"
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd account get-user-info \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --plaintext \
            --grpc-web

      - name: Ensure Application Exists & Sync
        env:
          ARGOCD_SERVER: "argocd-server.argocd.svc.cluster.local:80"
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APP_NAME: "test1-app"
          REPO_URL: "https://github.com/devops-end2end/test1.git"
          MANIFEST_PATH: "k8s"
          IMAGE: ${{ inputs.image }}

        run: |
          if ! argocd app get "$APP_NAME" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --plaintext \
            --grpc-web &>/dev/null; then

            echo "Application $APP_NAME does not exist. Creating..."

            argocd app create "$APP_NAME" \
              --repo "$REPO_URL" \
              --path "$MANIFEST_PATH" \
              --dest-server "https://kubernetes.default.svc" \
              --dest-namespace "default" \
              --project "default" \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --plaintext \
              --grpc-web
          fi

          echo "Syncing $APP_NAME..."
          echo "Image: $IMAGE"

          argocd app sync "$APP_NAME" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --plaintext \
            --grpc-web
