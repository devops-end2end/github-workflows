name: Deploy via Argo CD

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: "Project name"
        required: true
        type: string

      ENV:
        description: "Environment"
        required: true
        type: string

      DATACENTER:
        description: "Datacenter"
        required: true
        type: string

    secrets:
      ARGOCD_SERVER:
        required: true

      ARGOCD_AUTH_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: temp-runner

    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Sync and verify Argo CD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          ENV: ${{ inputs.ENV }}
          DATACENTER: ${{ inputs.DATACENTER }}
        run: |
          set -e

          ARGO_OPTS="--server ${ARGOCD_SERVER} \
            --auth-token ${ARGOCD_AUTH_TOKEN} \
            --insecure \
            --grpc-web"

          APP_NAME="argocd/${PROJECT_NAME}-${ENV}-${DATACENTER}"

          echo "========================================"
          echo "Argo CD Deployment"
          echo "========================================"
          echo "Application: ${APP_NAME}"
          echo "Environment: ${ENV}"
          echo "Datacenter: ${DATACENTER}"
          echo "========================================"

          echo "Refreshing Argo CD application..."
          argocd app get "${APP_NAME}" ${ARGO_OPTS} --refresh

          echo "Syncing application..."
          argocd app sync "${APP_NAME}" ${ARGO_OPTS}

          echo "Waiting for application to become Synced and Healthy..."
          argocd app wait "${APP_NAME}" ${ARGO_OPTS} \
            --sync \
            --health \
            --timeout 600

          echo "========================================"
          echo "Deployment successful"
          echo "Application: ${APP_NAME}"
          echo "========================================"
