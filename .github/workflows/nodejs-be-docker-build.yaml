name: Reusable Node.js Backend Docker Build & Push

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
        description: "Target Node.js runtime version (e.g., 18, 20, 22)"
      description:
        description: "Description of the application"
        required: false
        type: string
      base_image:
        description: "Override base runtime image (defaults to node:{version}-alpine)"
        required: false
        type: string
      port:
        description: "Port the service listens on (defaults to 3000)"
        required: false
        type: string
        default: "3000"
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
      disable_sonarqube:
        description: "Disable SonarQube Scan"
        type: boolean
        default: true
      disable_snyk:
        description: "Disable Snyk Scan"
        type: boolean
        default: true
      ecr_repository:
        description: "Override ECR repository name (defaults to the GitHub repo name)"
        required: false
        type: string
    outputs:
      image:
        description: "The built container image tag"
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  # 1. Pipeline Initialization & Variable Setup
  init:
    runs-on: devops-end2end-runners
    outputs:
      project_name: ${{ steps.vars.outputs.PROJECT_NAME }}
      version: ${{ steps.vars.outputs.VERSION }}
      base_image: ${{ steps.vars.outputs.BASE_IMAGE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node_version }}"
          cache: "npm"

      - name: Calculate and Validate Environment Variables
        id: vars
        shell: bash
        run: |
          PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_NAME="${GITHUB_REF_NAME}"

          # Extract version from package.json, defaulting to 0.1 if missing
          if [ -f package.json ]; then
            RAW_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.1")
          else
            RAW_VERSION="0.1"
          fi

          # Fail immediately if version is missing or unparseable
          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "undefined" ]; then
            echo "::error::Missing or invalid version in package.json. Platform compliance requires an explicit version defined in MAJOR.MINOR format (e.g., \"version\": \"0.1\"). Please update your package.json."
            exit 1
          fi

          # Enforce strict MAJOR.MINOR standard (fail build if revision/patch number like 0.1.0 is provided)
          IFS='.' read -r -a VERSION_PARTS <<< "$RAW_VERSION"
          if [ "${#VERSION_PARTS[@]}" -gt 2 ]; then
            echo "::error::Invalid version format '${RAW_VERSION}' detected in package.json. Platform compliance requires version to be strictly MAJOR.MINOR (e.g., '0.1'). Revision numbers (like '0.1.0') are managed automatically by the build engine. Please update your package.json version."
            exit 1
          fi

          MAJOR_MINOR="$RAW_VERSION"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}"
          else
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}-${BRANCH_NAME//\//-}"
          fi

          # Default to a minimal Node.js Alpine image for the runtime
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_IMAGE="${{ inputs.base_image }}"
          else
            BASE_IMAGE="node:${{ inputs.node_version }}-alpine"
          fi

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BASE_IMAGE=$BASE_IMAGE" >> $GITHUB_OUTPUT

  # 2. Unit Tests
  unit-tests:
    needs: init
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node_version }}"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Jest)
        run: npm test -- --coverage

      - name: Upload Test Coverage Artifact
        if: ${{ inputs.disable_sonarqube == false }}
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-be-build-artifacts
          path: |
            coverage/lcov.info

  # 3. SonarQube Scan (Conditional)
  sonar-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_sonarqube == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nodejs-be-build-artifacts

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=admarketplace_${{ needs.init.outputs.project_name }}
            -Dsonar.projectName=${{ needs.init.outputs.project_name }}
            -Dsonar.projectVersion=${{ needs.init.outputs.version }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.js,**/*.spec.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.organization=admarketplace

  # 4. Snyk Security Scan (Conditional)
  snyk-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_snyk == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node_version }}"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Snyk Open Source Security Test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 5. Build & Push Docker Image to ECR
  build-and-push:
    needs: [init, unit-tests]
    runs-on: devops-end2end-runners
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-output.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Dockerfile Exists
        shell: bash
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No local Dockerfile found. Baking multi-stage Node.js default into the workspace..."
            cat << "EOF" > Dockerfile
          # ==========================================
          # Stage 1: Install production dependencies
          # ==========================================
          FROM node:${{ inputs.node_version }}-alpine AS deps
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --omit=dev

          # ==========================================
          # Stage 2: Minimal Runtime Image
          # ==========================================
          FROM ${{ needs.init.outputs.base_image }} AS runtime

          LABEL com.datadoghq.tags.service=${{ needs.init.outputs.project_name }}
          LABEL com.datadoghq.tags.version=${{ needs.init.outputs.version }}

          ENV DD_SERVICE=${{ needs.init.outputs.project_name }}
          ENV DD_VERSION=${{ needs.init.outputs.version }}
          ENV NODE_ENV=production

          RUN addgroup -g 65532 -S nonroot && \
              adduser -u 65532 -S nonroot -G nonroot
          WORKDIR /app

          # Copy production deps and source from builder stages
          COPY --from=deps /app/node_modules ./node_modules
          COPY . .

          RUN chown -R nonroot:nonroot /app
          USER nonroot

          EXPOSE ${{ inputs.port }}
          CMD ["node", "src/index.js"]
          EOF
          else
            echo "Local Dockerfile found. Bypassing baked-in fallback."
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: "arn:aws:iam::932399238655:role/github-actions-ecr-role"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.ecr_repository || needs.init.outputs.project_name }}
          cache-to: type=gha,scope=${{ inputs.ecr_repository || needs.init.outputs.project_name }},mode=min

      - name: Set Image Output
        id: build-output
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}" >> $GITHUB_OUTPUT
