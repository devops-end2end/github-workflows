name: Reusable Go Docker Build & Push

on:
  workflow_call:
    inputs:
      go_version:
        required: true
        type: string
        description: "Target Go version (e.g., 1.21, 1.22, 1.23)"
      description:
        description: "Description of the application"
        required: false
        type: string
      base_image:
        description: "Override base runtime image (defaults to scratch)"
        required: false
        type: string
      port:
        description: "Port the service listens on (defaults to 8080)"
        required: false
        type: string
        default: "8080"
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
      disable_sonarqube:
        description: "Disable SonarQube Scan"
        type: boolean
        default: true
      disable_snyk:
        description: "Disable Snyk Scan"
        type: boolean
        default: true
      ecr_repository:
        description: "Override ECR repository name (defaults to the GitHub repo name)"
        required: false
        type: string
    outputs:
      image:
        description: "The built container image tag"
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  # 1. Pipeline Initialization & Variable Setup
  init:
    runs-on: devops-end2end-runners
    outputs:
      project_name: ${{ steps.vars.outputs.PROJECT_NAME }}
      version: ${{ steps.vars.outputs.VERSION }}
      base_image: ${{ steps.vars.outputs.BASE_IMAGE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version: "${{ inputs.go_version }}"
          cache: true

      - name: Calculate and Validate Environment Variables
        id: vars
        shell: bash
        run: |
          PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_NAME="${GITHUB_REF_NAME}"

          # Extract version from go.mod comment or VERSION file, defaulting to 0.1
          if [ -f VERSION ]; then
            RAW_VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            RAW_VERSION="0.1"
          fi

          # Fail immediately if version is missing or unparseable
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Missing or invalid version. Platform compliance requires a VERSION file with an explicit version in MAJOR.MINOR format (e.g., '0.1'). Please create a VERSION file in the repository root."
            exit 1
          fi

          # Enforce strict MAJOR.MINOR standard (fail build if revision/patch number like 0.1.0 is provided)
          IFS='.' read -r -a VERSION_PARTS <<< "$RAW_VERSION"
          if [ "${#VERSION_PARTS[@]}" -gt 2 ]; then
            echo "::error::Invalid version format '${RAW_VERSION}' detected in VERSION file. Platform compliance requires version to be strictly MAJOR.MINOR (e.g., '0.1'). Revision numbers (like '0.1.0') are managed automatically by the build engine. Please update your VERSION file."
            exit 1
          fi

          MAJOR_MINOR="$RAW_VERSION"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}"
          else
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}-${BRANCH_NAME//\//-}"
          fi

          # Default to scratch for the smallest possible Go runtime image
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_IMAGE="${{ inputs.base_image }}"
          else
            BASE_IMAGE="scratch"
          fi

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BASE_IMAGE=$BASE_IMAGE" >> $GITHUB_OUTPUT

  # 2. Unit Tests
  unit-tests:
    needs: init
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version: "${{ inputs.go_version }}"
          cache: true

      - name: Run Tests
        run: go test ./... -v -coverprofile=coverage.out -covermode=atomic

      - name: Convert Coverage to lcov
        run: |
          go install github.com/jandelgado/gcov2lcov@latest
          gcov2lcov -infile=coverage.out -outfile=coverage.lcov

      - name: Upload Test Coverage Artifact
        if: ${{ inputs.disable_sonarqube == false }}
        uses: actions/upload-artifact@v4
        with:
          name: go-build-artifacts
          path: |
            coverage.out
            coverage.lcov

  # 3. SonarQube Scan (Conditional)
  sonar-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_sonarqube == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: go-build-artifacts

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=admarketplace_${{ needs.init.outputs.project_name }}
            -Dsonar.projectName=${{ needs.init.outputs.project_name }}
            -Dsonar.projectVersion=${{ needs.init.outputs.version }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.organization=admarketplace

  # 4. Snyk Security Scan (Conditional)
  snyk-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_snyk == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ inputs.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version: "${{ inputs.go_version }}"
          cache: true

      - name: Run Snyk Open Source Security Test
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 5. Build Binary & Push Docker Image to ECR
  build-and-push:
    needs: [init, unit-tests]
    runs-on: devops-end2end-runners
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-output.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Dockerfile Exists
        shell: bash
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No local Dockerfile found. Baking multi-stage Go default into the workspace..."
            cat << "EOF" > Dockerfile
          # ==========================================
          # Stage 1: Build statically linked binary
          # ==========================================
          FROM golang:${{ inputs.go_version }}-alpine AS builder
          WORKDIR /build

          # Cache module downloads separately from source
          COPY go.mod go.sum ./
          RUN go mod download

          COPY . .

          # Build a statically linked binary for scratch compatibility
          RUN CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -ldflags="-s -w \
                -X main.Version=${{ needs.init.outputs.version }} \
                -X main.ServiceName=${{ needs.init.outputs.project_name }}" \
              -o /build/app .

          # ==========================================
          # Stage 2: Minimal Runtime Image (scratch)
          # ==========================================
          FROM ${{ needs.init.outputs.base_image }} AS runtime

          LABEL com.datadoghq.tags.service=${{ needs.init.outputs.project_name }}
          LABEL com.datadoghq.tags.version=${{ needs.init.outputs.version }}

          ENV DD_SERVICE=${{ needs.init.outputs.project_name }}
          ENV DD_VERSION=${{ needs.init.outputs.version }}

          # Copy CA certificates for TLS (required when using scratch)
          COPY --from=builder /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/

          # Copy statically linked binary
          COPY --from=builder /build/app /app

          EXPOSE ${{ inputs.port }}
          ENTRYPOINT ["/app"]
          EOF
          else
            echo "Local Dockerfile found. Bypassing baked-in fallback."
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: "arn:aws:iam::932399238655:role/github-actions-ecr-role"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository || needs.init.outputs.project_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.ecr_repository || needs.init.outputs.project_name }}
          cache-to: type=gha,scope=${{ inputs.ecr_repository || needs.init.outputs.project_name }},mode=min

      - name: Set Image Output
        id: build-output
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}" >> $GITHUB_OUTPUT
