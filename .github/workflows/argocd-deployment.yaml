name: Deploy via Argo CD

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: "Project name (used for app name/path generation)"
        required: true
        type: string
      IMAGE:
        description: "Complete container image reference"
        required: true
        type: string
      APPSET_PATH:
        description: "Path to single-env ApplicationSet manifest in GitOps repository"
        required: true
        type: string
      ARGOCD_SERVER:
        description: "Argo CD Server address or internal host"
        required: false
        type: string
        default: "argocd-server.argocd.svc.cluster.local:80"
      GITOPS_REPO:
        description: "Git repository"
        required: false
        type: string
        default: "gitops"
      ARGOCD_CLI_VERSION:
        description: "Argo CD CLI Version"
        required: false
        type: string
        default: "v3.5.2"
      TIMEOUT:
        description: "Timeout for ArgoCD app wait"
        required: false
        type: string
        default: "120"
      CHECK_HEALTH:
        description: "Check ArgoCD app health"
        required: false
        type: string
        default: "true"
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true
      GITOPS_REPO_TOKEN:
        required: true

jobs:
  prepare-and-apply:
    runs-on: devops-end2end-runners
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Install Required CLI Tools (yq, Kustomize, ArgoCD)
        run: |
          # yq
          YQ_VERSION="v4.40.5"
          curl -sSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq

          # Kustomize
          KUSTOMIZE_VERSION="5.4.1"
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf "kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

          # Argo CD CLI
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: devops-end2end/gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: ${{ inputs.GITOPS_REPO }}

      - name: Parse Single-Env ApplicationSet & Update Image Tags
        id: generate-matrix
        env:
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          IMAGE: ${{ inputs.IMAGE }}
          GITOPS_REPO: ${{ inputs.GITOPS_REPO }}
          APPSET_PATH: ${{ inputs.APPSET_PATH }}
        run: |
          FULL_APPSET_PATH="${GITOPS_REPO}/${APPSET_PATH}"

          if [ ! -f "$FULL_APPSET_PATH" ]; then
            echo "ERROR: ApplicationSet file not found: $FULL_APPSET_PATH"
            exit 1
          fi

          # Extract target datacenters defined in this specific ApplicationSet file
          ELEMENTS_JSON=$(yq -o=json '.spec.generators[].list.elements' "$FULL_APPSET_PATH")

          # Iterate over only the elements specified in this environment's AppSet
          echo "$ELEMENTS_JSON" | jq -c '.[]' | while read -r item; do
            ENV=$(echo "$item" | jq -r '.env')
            DC=$(echo "$item" | jq -r '.datacenter')
            
            TARGET_DIR="${GITOPS_REPO}/${PROJECT_NAME}/env/${ENV}-${DC}"
            if [ -d "$TARGET_DIR" ]; then
              echo "Updating image in $TARGET_DIR to: $IMAGE"
              (cd "$TARGET_DIR" && kustomize edit set image "$IMAGE")
            else
              echo "⚠️ Directory $TARGET_DIR not found, skipping..."
            fi
          done

          # Output dynamic application list for matrix deployment
          MATRIX_JSON=$(echo "$ELEMENTS_JSON" | jq -c --arg proj "$PROJECT_NAME" \
            'map({app_name: "\($proj)-\(.env)-\(.datacenter)"})')

          echo "Generated Matrix for AppSet ($APPSET_PATH): $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Commit and push manifest updates
        env:
          GITOPS_REPO: ${{ inputs.GITOPS_REPO }}
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          APPSET_PATH: ${{ inputs.APPSET_PATH }}
        run: |
          cd "$GITOPS_REPO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ${PROJECT_NAME} image tag for ${APPSET_PATH} [skip ci]"
            git push
          fi

      - name: Apply ArgoCD ApplicationSet
        run: |
          set -euo pipefail
          FULL_APPSET_PATH="${{ inputs.GITOPS_REPO }}/${{ inputs.APPSET_PATH }}"

          echo "Applying ApplicationSet from: $FULL_APPSET_PATH"
          argocd appset create "$FULL_APPSET_PATH" \
            --upsert \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web
          echo "ApplicationSet applied successfully"

  sync-and-wait:
    needs: prepare-and-apply
    runs-on: devops-end2end-runners
    strategy:
      matrix:
        app: ${{ fromJson(needs.prepare-and-apply.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Install Argo CD CLI
        run: |
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Sync ArgoCD Application
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app.app_name }}"
          
          echo "Syncing ArgoCD app: $APP_NAME"
          if ! argocd app sync "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web; then
            echo "❌ ArgoCD app sync failed for $APP_NAME"
            exit 1
          fi
          echo "✓ ArgoCD app $APP_NAME synced successfully"

      - name: Wait for ArgoCD Application
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app.app_name }}"
          TIMEOUT="${{ inputs.TIMEOUT }}"
          CHECK_HEALTH="${{ inputs.CHECK_HEALTH }}"
          HEALTH=""
          if [ "$CHECK_HEALTH" = "true" ]; then
            HEALTH="--health"
          fi

          echo "Waiting for ArgoCD app sync: $APP_NAME (Timeout: ${TIMEOUT}s)"
          
          set +e
          argocd app wait "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web --sync $HEALTH --timeout "$TIMEOUT"
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ ArgoCD app wait failed with exit code: $EXIT_CODE for $APP_NAME"
            exit $EXIT_CODE
          fi
          
          echo "✓ ArgoCD app $APP_NAME wait completed successfully"