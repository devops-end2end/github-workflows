name: Deploy via Argo CD

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: "Project name (used for default app name/path generation)"
        required: false
        type: string
      ENV:
        description: "Environment (used for default app name/path generation)"
        required: false
        type: string
      DATACENTER:
        description: "Datacenter (used for default app name/path generation)"
        required: false
        type: string
      APP_NAME:
        description: "Override target Argo CD application name"
        required: false
        type: string
      APP_PATH:
        description: "Override path to manifests in GitOps repository"
        required: false
        type: string
      ARGOCD_SERVER:
        description: "Argo CD Server address or internal host"
        required: false
        type: string
        default: "argocd-server.argocd.svc.cluster.local:80"
      DEST_NAMESPACE:
        description: "Target Kubernetes namespace"
        required: false
        type: string
      REPO_URL:
        description: "Git repository containing Kubernetes manifests"
        required: false
        type: string
        default: "https://github.com/devops-end2end/gitops.git"
      TARGET_REVISION:
        description: "Target Git branch, tag, or commit"
        required: false
        type: string
        default: "HEAD"
      ARGOCD_CLI_VERSION:
        description: "Argo CD CLI Version"
        required: false
        type: string
        default: "v3.5.2"
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: devops-end2end-runners

    steps:
      - name: Install Argo CD CLI
        run: |
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            echo "Installing Argo CD CLI ${CLI_VER}..."
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Ensure Application Exists and Sync
        env:
          ARGOCD_SERVER: "${{ inputs.ARGOCD_SERVER }}"
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          # Fallback logic: Use explicit APP_NAME/APP_PATH if provided, else construct from parameters
          TARGET_APP_NAME: "${{ inputs.APP_NAME || format('{0}-{1}-{2}', inputs.PROJECT_NAME, inputs.ENV, inputs.DATACENTER) }}"
          TARGET_APP_PATH: "${{ inputs.APP_PATH || format('{0}/env/{1}-{2}', inputs.PROJECT_NAME, inputs.ENV, inputs.DATACENTER) }}"
          TARGET_NAMESPACE: "${{ inputs.DEST_NAMESPACE || inputs.ENV || 'default' }}"
        run: |
          set -euo pipefail

          ARGO_FLAGS="--server ${ARGOCD_SERVER} --auth-token ${ARGOCD_AUTH_TOKEN} --plaintext"

          echo "========================================"
          echo "Argo CD Deployment"
          echo "========================================"
          echo "Server      : ${ARGOCD_SERVER}"
          echo "Application : ${TARGET_APP_NAME}"
          echo "Path        : ${TARGET_APP_PATH}"
          echo "Namespace   : ${TARGET_NAMESPACE}"
          echo "========================================"

          # Create application if missing, otherwise refresh state
          if ! argocd app get "${TARGET_APP_NAME}" ${ARGO_FLAGS} &>/dev/null; then
            echo "Application '${TARGET_APP_NAME}' does not exist. Creating..."

            argocd app create "${TARGET_APP_NAME}" ${ARGO_FLAGS} \
              --repo "${{ inputs.REPO_URL }}" \
              --path "${TARGET_APP_PATH}" \
              --dest-server "https://kubernetes.default.svc" \
              --dest-namespace "${TARGET_NAMESPACE}" \
              --revision "${{ inputs.TARGET_REVISION }}" \
              --project default \
              --sync-policy automated \
              --auto-prune \
              --self-heal
          else
            echo "Application '${TARGET_APP_NAME}' exists. Refreshing state from Git..."
            argocd app get "${TARGET_APP_NAME}" ${ARGO_FLAGS} --refresh > /dev/null
          fi

          echo "Initiating Application Synchronization..."
          argocd app sync "${TARGET_APP_NAME}" ${ARGO_FLAGS} --prune

          echo "Waiting for Sync & Health status (Timeout: 10m)..."
          argocd app wait "${TARGET_APP_NAME}" ${ARGO_FLAGS} \
            --sync \
            --health \
            --timeout 600

          echo "========================================"
          echo "Deployment successful!"
          echo "========================================"