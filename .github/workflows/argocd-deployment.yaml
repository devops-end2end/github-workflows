name: Deploy via Argo CD

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: "Project name (used for default app name/path generation)"
        required: false
        type: string
      ENV:
        description: "Environment (used for default app name/path generation)"
        required: false
        type: string
      DATACENTER:
        description: "Datacenter (used for default app name/path generation)"
        required: false
        type: string
      APPSET_PATH:
        description: "Override path to manifests in GitOps repository"
        required: false
        type: string
      ARGOCD_SERVER:
        description: "Argo CD Server address or internal host"
        required: false
        type: string
        default: "argocd-server.argocd.svc.cluster.local:80"
      GITOPS_REGISTRY:
        description: "Git registry"
        required: false
        type: string
      GITOPS_REPO:
        description: "Git repository"
        required: false
        type: string
      ARGOCD_CLI_VERSION:
        description: "Argo CD CLI Version"
        required: false
        type: string
        default: "v3.5.2"
      TIMEOUT:
        description: "Timeout for ArgoCD app wait"
        required: false
        type: string
        default: "60"
      CHECK_HEALTH:
        description: "Check ArgoCD app health"
        required: false
        type: string
        default: "true"
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true
      GITOPS_REPO_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: devops-end2end-runners

    steps:
      - name: Install Argo CD CLI
        run: |
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            echo "Installing Argo CD CLI ${CLI_VER}..."
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION="5.4.1"

          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"

          tar -xzf "kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"

          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: devops-end2end/gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: ${{ inputs.GITOPS_REPO || 'gitops' }}

      - name: Update Image
        env:
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          ENV: ${{ inputs.ENV }}
          DATACENTER: ${{ inputs.DATACENTER }}
          IMAGE: ${{ inputs.IMAGE }}
        run: |
          cd "gitops/${PROJECT_NAME}/env/${ENV}-${DATACENTER}"

          echo "Updating image to:"
          echo "${IMAGE}"

          kustomize edit set image "${IMAGE}"

      - name: Commit and push
        env:
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          ENV: ${{ inputs.ENV }}
          DATACENTER: ${{ inputs.DATACENTER }}
        run: |
          cd gitops

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update ${PROJECT_NAME} ${ENV}-${DATACENTER}"

          git push

      - name: Apply ArgoCD ApplicationSet
        run: |
          set -euo pipefail
          APPSET_PATH="${{ inputs.GITOPS_REPO || 'gitops' }}/${{ inputs.APPSET_PATH }}"

          if [ ! -f "$APPSET_PATH" ]; then
            echo "ERROR: ApplicationSet file not found: $APPSET_PATH"
            exit 1
          fi

          echo "Applying ApplicationSet from: $APPSET_PATH"
          argocd appset create "$APPSET_PATH" \
            --upsert \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web
          echo "ApplicationSet applied successfully"

      - name: Sync ArgoCD Application
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.PROJECT_NAME }}-${{ inputs.ENV }}-${{ inputs.DATACENTER }}"
          
          echo "Syncing ArgoCD app: $APP_NAME"
          
          # Sync the app and check for errors
          echo "Running argocd app sync..."
          if ! argocd app sync "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web; then
            echo " ArgoCD app sync failed"
            exit 1
          fi
          
          echo " ArgoCD app synced successfully"

      - name: Wait for ArgoCD Application
        run: |
          set -euo pipefail
          APP_NAME="${{ inputs.PROJECT_NAME }}-${{ inputs.ENV }}-${{ inputs.DATACENTER }}"
          TIMEOUT="${{ inputs.TIMEOUT }}"
          CHECK_HEALTH="${{ inputs.CHECK_HEALTH }}"
          HEALTH=""
          if [ "$CHECK_HEALTH" = "true" ]; then
            HEALTH="--health"
          fi

          echo "Waiting for ArgoCD app sync: $APP_NAME"
          echo "Timeout: $TIMEOUT seconds"
          
          set +e
          argocd app wait "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web --sync $HEALTH --timeout "$TIMEOUT"
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ ArgoCD app wait failed with exit code: $EXIT_CODE"
            echo "App: $APP_NAME may have timed out or failed to sync"
            exit $EXIT_CODE
          fi
          
          echo "✓ ArgoCD app wait completed successfully"
