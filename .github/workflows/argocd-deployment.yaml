name: Deploy via Argo CD

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: "Project name (used for app name/path generation)"
        required: true
        type: string
      IMAGE:
        description: "Complete container image reference"
        required: true
        type: string
      DIGEST:
        description: "Immutable image digest (sha256:...) for Cosign signature and SBOM attestation verification. When provided, verification is a hard gate — deployment is blocked if the image is not signed or the SBOM attestation is missing."
        required: false
        type: string
        # --- Attestation Verification Strategy ---
        # Option A (current): Cosign verifies the signature and SBOM attestation before any GitOps
        #   commit is made. Deployment proceeds using the mutable image tag. Fast, no GitOps
        #   repo structure changes needed.
        #
        # Option B (future consideration): In addition to Option A verification, replace the
        #   mutable image tag in the kustomization patch with an immutable image@digest reference
        #   (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/my-app@sha256:abc...). ArgoCD then
        #   deploys by digest, making the deployed ref fully pinned and traceable. Requires the
        #   GitOps kustomization patch structure to support image@digest syntax.
      APPSET_PATH:
        description: "Path to single-env ApplicationSet manifest in GitOps repository"
        required: true
        type: string
      ARGOCD_SERVER:
        description: "Argo CD Server address or internal host"
        required: false
        type: string
        default: "argocd-server.argocd.svc.cluster.local:80"
      GITOPS_REPO:
        description: "Git repository"
        required: false
        type: string
        default: "gitops"
      ARGOCD_CLI_VERSION:
        description: "Argo CD CLI Version"
        required: false
        type: string
        default: "v3.5.2"
      KUSTOMIZE_VERSION:
        description: "Kustomize Version"
        required: false
        type: string
        default: "5.4.1"
      YQ_VERSION:
        description: "yq Version"
        required: false
        type: string
        default: "v4.40.5"
      TIMEOUT:
        description: "Timeout for ArgoCD app wait"
        required: false
        type: string
        default: "120"
      CHECK_HEALTH:
        description: "Check ArgoCD app health"
        required: false
        type: string
        default: "true"
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true
      GITOPS_REPO_TOKEN:
        required: true

jobs:
  prepare-and-apply:
    runs-on: devops-end2end-runners
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Install Required CLI Tools (yq, Kustomize, ArgoCD)
        run: |
          # yq
          YQ_VERSION="${{ inputs.YQ_VERSION }}"
          curl -sSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq

          # Kustomize
          KUSTOMIZE_VERSION="${{ inputs.KUSTOMIZE_VERSION }}"
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf "kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

          # Argo CD CLI
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: "arn:aws:iam::932399238655:role/github-actions-ecr-role"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Install Cosign only when a digest is provided. The verify steps below are a hard gate —
      # the workflow will fail before touching the GitOps repo if verification does not pass.
      - name: Install gettext-base (for envsubst)
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Install Cosign
        if: ${{ inputs.DIGEST != '' }}
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Verify image signature and SBOM attestation
        if: ${{ inputs.DIGEST != '' }}
        shell: bash
        env:
          IMAGE: ${{ inputs.IMAGE }}
          DIGEST: ${{ inputs.DIGEST }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE}@${DIGEST}"

          COSIGN_IDENTITY="https://github.com/devops-end2end/github-workflows/.github/workflows/python-docker-build.yaml@refs/heads/main"
          COSIGN_ISSUER="https://token.actions.githubusercontent.com"

          echo "Verifying Cosign signature for: $IMAGE_REF"

          cosign verify \
            --certificate-identity="$COSIGN_IDENTITY" \
            --certificate-oidc-issuer="$COSIGN_ISSUER" \
            "$IMAGE_REF"

          echo "✓ Image signature verified"

          echo "Verifying CycloneDX SBOM attestation..."

          cosign verify-attestation \
            --type cyclonedx \
            --verbose \
            --certificate-identity="$COSIGN_IDENTITY" \
            --certificate-oidc-issuer="$COSIGN_ISSUER" \
            "$IMAGE_REF" > output

          echo "✓ SBOM attestation verified"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: devops-end2end/gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: ${{ inputs.GITOPS_REPO }}

      - name: Parse ApplicationSet & Update Image Tags
        id: generate-matrix
        env:
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          IMAGE: ${{ inputs.IMAGE }}
          GITOPS_REPO: ${{ inputs.GITOPS_REPO }}
          APPSET_PATH: ${{ inputs.APPSET_PATH }}
        run: |
          FULL_APPSET_PATH="${GITOPS_REPO}/${APPSET_PATH}"

          if [ ! -f "$FULL_APPSET_PATH" ]; then
            echo "ERROR: ApplicationSet file not found: $FULL_APPSET_PATH"
            exit 1
          fi

          ELEMENTS_JSON=$(yq -o=json '.spec.generators[].list.elements' "$FULL_APPSET_PATH")

          echo "$ELEMENTS_JSON" | jq -c '.[]' | while read -r item; do
            ENV=$(echo "$item" | jq -r '.env')
            DC=$(echo "$item" | jq -r '.datacenter')
            
            TARGET_DIR="${GITOPS_REPO}/apps/${PROJECT_NAME}/env/${ENV}-${DC}"
            if [ -d "$TARGET_DIR" ]; then
              echo "Updating image in $TARGET_DIR to: $IMAGE"
              (cd "$TARGET_DIR" && kustomize edit set image "$IMAGE")
            else
              echo "⚠️ Directory $TARGET_DIR not found, skipping..."
            fi
          done

          MATRIX_JSON=$(echo "$ELEMENTS_JSON" | jq -c --arg proj "$PROJECT_NAME" \
            'map({app_name: "\($proj)-\(.env)-\(.datacenter)"})')

          echo "Generated Matrix for AppSet ($APPSET_PATH): $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

      - name: Commit and push manifest updates
        env:
          GITOPS_REPO: ${{ inputs.GITOPS_REPO }}
          PROJECT_NAME: ${{ inputs.PROJECT_NAME }}
          APPSET_PATH: ${{ inputs.APPSET_PATH }}
        run: |
          cd "$GITOPS_REPO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ${PROJECT_NAME} image tag for ${APPSET_PATH} [skip ci]"
            git push
          fi

      - name: Apply ArgoCD ApplicationSet
        run: |
          set -euo pipefail
          FULL_APPSET_PATH="${{ inputs.GITOPS_REPO }}/${{ inputs.APPSET_PATH }}"

          echo "Applying ApplicationSet from: $FULL_APPSET_PATH"
          argocd appset create "$FULL_APPSET_PATH" \
            --upsert \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web
          echo "ApplicationSet applied successfully"

  sync-and-wait:
    needs: prepare-and-apply
    runs-on: devops-end2end-runners
    strategy:
      matrix:
        app: ${{ fromJson(needs.prepare-and-apply.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Install Argo CD CLI
        run: |
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Wait for Application Existence & Sync ArgoCD Application
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app.app_name }}"

          # Step 1: Retry loop waiting for ApplicationSet controller to generate the Application
          echo "Waiting for ArgoCD application '$APP_NAME' to be registered by ApplicationSet controller..."
          MAX_RETRIES=12
          RETRY_INTERVAL=5
          count=0

          until argocd app get "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web >/dev/null 2>&1; do
            count=$((count + 1))
            if [ $count -ge $MAX_RETRIES ]; then
              echo "❌ Timed out waiting for ArgoCD app '$APP_NAME' to exist."
              exit 1
            fi
            echo "App '$APP_NAME' not found yet. Retrying in ${RETRY_INTERVAL}s... ($count/$MAX_RETRIES)"
            sleep $RETRY_INTERVAL
          done

          echo "✓ ArgoCD app '$APP_NAME' exists."

          # Step 2: Sync with retry loop
          echo "Syncing ArgoCD app: $APP_NAME"
          SYNC_RETRIES=3
          SYNC_COUNT=0

          until argocd app sync "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web; do
            SYNC_COUNT=$((SYNC_COUNT + 1))
            if [ $SYNC_COUNT -ge $SYNC_RETRIES ]; then
              echo "❌ ArgoCD app sync failed after $SYNC_RETRIES attempts"
              exit 1
            fi
            echo "Sync command failed/rejected. Retrying in 10s... ($SYNC_COUNT/$SYNC_RETRIES)"
            sleep 10
          done

          echo "✓ ArgoCD app $APP_NAME synced successfully"

      - name: Wait for ArgoCD Application Health
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app.app_name }}"
          TIMEOUT="${{ inputs.TIMEOUT }}"
          CHECK_HEALTH="${{ inputs.CHECK_HEALTH }}"
          HEALTH=""
          if [ "$CHECK_HEALTH" = "true" ]; then
            HEALTH="--health"
          fi

          echo "Waiting for ArgoCD app sync: $APP_NAME (Timeout: ${TIMEOUT}s)"

          set +e
          argocd app wait "$APP_NAME" \
            --server ${{ inputs.ARGOCD_SERVER }} \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web --sync $HEALTH --timeout "$TIMEOUT"
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ ArgoCD app wait failed with exit code: $EXIT_CODE for $APP_NAME"
            exit $EXIT_CODE
          fi

          echo "✓ ArgoCD app $APP_NAME wait completed successfully"
