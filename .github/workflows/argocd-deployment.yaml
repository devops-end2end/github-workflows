name: Deploy via Argo CD

on:
  workflow_call:
    inputs:
      APP_NAME:
        description: "Argo CD application name (e.g., my-app-dev-home-lab)"
        required: true
        type: string
      APP_PATH:
        description: "Path to manifests in GitOps repository (e.g., my-app/env/dev-home-lab)"
        required: true
        type: string
      ARGOCD_SERVER:
        description: "Argo CD Server address or internal host"
        required: false
        type: string
        default: "argocd-server.argocd.svc.cluster.local:80"
      DEST_NAMESPACE:
        description: "Target Kubernetes namespace"
        required: false
        type: string
        default: "default"
      REPO_URL:
        description: "Git repository containing Kubernetes manifests"
        required: false
        type: string
        default: "https://github.com/devops-end2end/gitops.git"
      TARGET_REVISION:
        description: "Target Git branch, tag, or commit"
        required: false
        type: string
        default: "HEAD"
      ARGOCD_CLI_VERSION:
        description: "Argo CD CLI Version"
        required: false
        type: string
        default: "v3.5.2"
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: devops-end2end-runners

    env:
      ARGOCD_SERVER: "${{ inputs.ARGOCD_SERVER }}"
      APP_NAME: "${{ inputs.APP_NAME }}"
      APP_PATH: "${{ inputs.APP_PATH }}"

    steps:
      - name: Install Argo CD CLI
        run: |
          CLI_VER="${{ inputs.ARGOCD_CLI_VERSION }}"
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${CLI_VER}"* ]]; then
            echo "Installing Argo CD CLI ${CLI_VER}..."
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${CLI_VER}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Ensure Application Exists and Sync
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          ARGO_FLAGS="--server ${ARGOCD_SERVER} --auth-token ${ARGOCD_AUTH_TOKEN} --plaintext"

          echo "========================================"
          echo "Argo CD Deployment"
          echo "========================================"
          echo "Server      : ${ARGOCD_SERVER}"
          echo "Application : ${APP_NAME}"
          echo "Path        : ${APP_PATH}"
          echo "========================================"

          # Create application if missing, otherwise refresh state
          if ! argocd app get "${APP_NAME}" ${ARGO_FLAGS} &>/dev/null; then
            echo "Application '${APP_NAME}' does not exist. Creating..."

            argocd app create "${APP_NAME}" ${ARGO_FLAGS} \
              --repo "${{ inputs.REPO_URL }}" \
              --path "${APP_PATH}" \
              --dest-server "https://kubernetes.default.svc" \
              --dest-namespace "${{ inputs.DEST_NAMESPACE }}" \
              --revision "${{ inputs.TARGET_REVISION }}" \
              --project default \
              --sync-policy automated \
              --auto-prune \
              --self-heal
          else
            echo "Application '${APP_NAME}' exists. Refreshing state from Git..."
            argocd app get "${APP_NAME}" ${ARGO_FLAGS} --refresh > /dev/null
          fi

          echo "Initiating Application Synchronization..."
          argocd app sync "${APP_NAME}" ${ARGO_FLAGS} --prune

          echo "Waiting for Sync & Health status (Timeout: 10m)..."
          argocd app wait "${APP_NAME}" ${ARGO_FLAGS} \
            --sync \
            --health \
            --timeout 600

          echo "========================================"
          echo "Deployment successful!"
          echo "========================================"