name: Delete ArgoCD ApplicationSet

on:
  workflow_call:
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true
    inputs:
      appset_name:
        description: "Appset name"
        required: true
        type: string

jobs:
  delete-appset:
    runs-on: devops-end2end-runners
    steps:
      - name: Install Required CLI Tools (ArgoCD)
        env:
          ARGOCD_CLI_VERSION: "v3.5.2"
        run: |
          # Argo CD CLI
          if ! command -v argocd &> /dev/null || [[ "$(argocd version --client --short 2>/dev/null)" != *"${ARGOCD_CLI_VERSION}"* ]]; then
            curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-linux-amd64"
            chmod +x argocd
            sudo mv argocd /usr/local/bin/
          fi

      - name: Delete ArgoCD ApplicationSet from Cluster
        env:
          APPSET_NAME: ${{ inputs.appset_name }}
          ARGOCD_SERVER: "argocd-server.argocd.svc.cluster.local:80"
        run: |
          echo "Deleting ApplicationSet: $APPSET_NAME"
          argocd appset delete "$APPSET_NAME" \
            --server $ARGOCD_SERVER \
            --plaintext --auth-token "${{ secrets.ARGOCD_AUTH_TOKEN }}" --grpc-web
          echo "ApplicationSet $APPSET_NAME deleted successfully"
