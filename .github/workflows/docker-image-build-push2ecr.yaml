name: Build Docker Image and Push to ECR

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-to-assume:
        description: AWS IAM Role ARN for OIDC
        required: false
        type: string
        default: "arn:aws:iam::932399238655:role/github-actions-ecr-role"
      aws-region:
        description: AWS Region
        required: false
        type: string
        default: "us-east-1"
    outputs:
      image:
        description: Docker image URI
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: devops-end2end-runners
    outputs:
      image: ${{ steps.build-output.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and Push Docker Image
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          BUILDKIT_PROGRESS: plain
          BUILDKIT_DEBUG: 1
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker buildx build \
            --progress=plain \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "$IMAGE_URI:$IMAGE_TAG" \
            --tag "$IMAGE_URI:latest" \
            --tag "$IMAGE_URI:$GITHUB_SHA" \
            --push \
            .

      - name: Set Image Output
        id: build-output
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
