name: Build Docker Image and Push to ECR

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-to-assume:
        description: AWS IAM Role ARN for OIDC
        required: false
        type: string
        default: "arn:aws:iam::932399238655:role/github-actions-ecr-role"
      aws-region:
        description: AWS Region
        required: false
        type: string
        default: "us-east-1"
    outputs:
      image:
        description: Docker image URI
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required to checkout the code

jobs:
  build-and-push: 
    runs-on: devops-end2end-runners
    outputs:
      image: ${{ steps.build.outputs.image }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        id: ecr-auth
        uses: devops-end2end/github-workflows/actions/ecr-auth@main
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: Build, Tag, and Push Docker Image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-auth.outputs.ecr-registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
