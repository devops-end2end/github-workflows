name: Build Docker Image and Push to ECR

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-to-assume:
        description: AWS IAM Role ARN for OIDC
        required: false
        type: string
        default: "arn:aws:iam::932399238655:role/github-actions-ecr-role"
      aws-region:
        description: AWS Region
        required: false
        type: string
        default: "us-east-1"
    outputs:
      image:
        description: Docker image URI
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: devops-end2end-runners

    outputs:
      image: ${{ steps.build-output.outputs.image }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.run_number }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.ecr-repository }}
          cache-to: type=gha,scope=${{ inputs.ecr-repository }},mode=max

      # - name: Build and Push Docker Image
      #   id: build
      #   shell: bash
      #   env:
      #     REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      #     ECR_REPOSITORY: ${{ inputs.ecr-repository }}
      #     IMAGE_TAG: ${{ github.run_number }}
      #     GITHUB_SHA: ${{ github.sha }}
      #     CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
      #     CACHE_URL_V2: ${{ env.ACTIONS_RESULTS_URL }}
      #     CACHE_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
      #   run: |
      #     set -euo pipefail

      #     IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"

      #     # Fail early if the runner doesn't expose the cache runtime credentials.
      #     if [[ -z "${CACHE_TOKEN:-}" ]]; then
      #       echo "::error::ACTIONS_RUNTIME_TOKEN is unavailable to this build step."
      #       exit 1
      #     fi

      #     if [[ -z "${CACHE_URL_V2:-}" && -z "${CACHE_URL:-}" ]]; then
      #       echo "::error::GitHub Actions cache service URL is unavailable."
      #       exit 1
      #     fi

      #     # Prefer the v2 cache service when its URL is available.
      #     if [[ -n "${CACHE_URL_V2:-}" ]]; then
      #       CACHE_BACKEND="type=gha,version=2,token=$CACHE_TOKEN,url_v2=$CACHE_URL_V2,scope=$ECR_REPOSITORY"
      #     else
      #       CACHE_BACKEND="type=gha,version=1,token=$CACHE_TOKEN,url=$CACHE_URL,scope=$ECR_REPOSITORY"
      #     fi

      #     docker buildx build \
      #       --progress=plain \
      #       --cache-from "$CACHE_BACKEND" \
      #       --cache-to "$CACHE_BACKEND,mode=max" \
      #       --tag "$IMAGE_URI:$IMAGE_TAG" \
      #       --tag "$IMAGE_URI:latest" \
      #       --tag "$IMAGE_URI:$GITHUB_SHA" \
      #       --push \
      #       .

      - name: Set Image Output
        id: build-output
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
