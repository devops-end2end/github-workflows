name: Build Docker Image and Push to ECR

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-to-assume:
        description: AWS IAM Role ARN for OIDC
        required: false
        type: string
        default: "arn:aws:iam::932399238655:role/github-actions-ecr-role"
      aws-region:
        description: AWS Region
        required: false
        type: string
        default: "us-east-1"
    outputs:
      image:
        description: Docker image URI
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: devops-end2end-runners
    outputs:
      image: ${{ steps.build-output.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.run_number }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          # Enables persistent caching across GitHub Action runs
          cache-from: type=gha,scope=${{ inputs.ecr-repository }}
          cache-to: type=gha,mode=max,scope=${{ inputs.ecr-repository }}

      - name: Build and Push Docker Image
        shell: bash
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$REGISTRY/${{ inputs.ecr-repository }}"

          docker build -t $IMAGE_URI:${{ github.run_number }} \
                       -t $IMAGE_URI:latest \
                       -t $IMAGE_URI:${{ github.sha }} \
                       .

          docker push $IMAGE_URI:${{ github.run_number }}
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:${{ github.sha }}

      - name: Set Image Output
        id: build-output
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.run_number }}" >> $GITHUB_OUTPUT
