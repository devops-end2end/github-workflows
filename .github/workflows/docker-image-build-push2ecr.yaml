name: Build Docker Image and Push to ECR

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-to-assume:
        description: AWS IAM Role ARN for OIDC
        required: false
        type: string
        default: "arn:aws:iam::932399238655:role/github-actions-ecr-role"
      aws-region:
        description: AWS Region
        required: false
        type: string
        default: "us-east-1"
    outputs:
      image:
        description: Docker image URI
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required to checkout the code

jobs:
  ecr-auth:
    runs-on: devops-end2end-runners
    outputs:
      ecr_token: ${{ steps.ecr-token.outputs.ecr_token }}
      ecr-registry: ${{ steps.ecr-auth.outputs.ecr-registry }}
    steps:
      - name: Configure AWS Credentials via OIDC
        id: ecr-auth
        uses: devops-end2end/github-workflows/actions/ecr-auth@main
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}

      - name: Get ECR Password
        id: ecr-token
        shell: bash
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ inputs.aws-region }})
          echo "ecr_token=$TOKEN" >> $GITHUB_OUTPUT

  build-and-push: 
    runs-on: devops-end2end-runners
    needs: ecr-auth
    outputs:
      image: ${{ steps.build-output.outputs.image }}      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build, Tag, and Push Docker Image
        uses: aevea/action-kaniko@master
        with:
          registry: 932399238655.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com
          image: ${{ inputs.ecr-repository }}
          username: AWS
          password: ${{ needs.ecr-auth.outputs.ecr_token }}
          cache: true
          tag: ${{ github.run_number }}, latest, ${{ github.sha }}

      - name: Set Image Output
        id: build-output
        shell: bash
        run: |
          echo "image=932399238655.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/${{ inputs.ecr-repository }}:${{ github.run_number }}" >> $GITHUB_OUTPUT