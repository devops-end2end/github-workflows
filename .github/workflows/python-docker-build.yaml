name: Python Build Pipeline

on:
  workflow_call:
    inputs:
      py_version:
        description: "Python Version"
        required: false
        default: "3.11"
        type: string
      description:
        description: "Description of the application"
        required: false
        type: string
      base_image:
        description: "Override base docker image"
        required: false
        type: string
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
      disable_sonarqube:
        description: "Disable SonarQube Scan"
        type: boolean
        default: true
      disable_snyk:
        description: "Disable Snyk Scan"
        type: boolean
        default: true
    outputs:
      image:
        description: "The built container image tag"
        value: ${{ jobs.build-and-push.outputs.image }}
  push:
    branches: ["main", "master", "develop", "feature/*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      py_version:
        description: "Python Version"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
      base_image:
        description: "Override base docker image (defaults to upstream python)"
        required: false
        type: string
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
      disable_sonarqube:
        description: "Disable SonarQube Scan"
        type: boolean
        default: false
      disable_snyk:
        description: "Disable Snyk Scan"
        type: boolean
        default: false

env:
  PY_VER: ${{ inputs.py_version || '3.11' }}
  AWS_REGION: ${{ inputs.aws_region || 'us-east-1' }}
  DISABLE_SONARQUBE: ${{ inputs.disable_sonarqube || false }}
  DISABLE_SNYK: ${{ inputs.disable_snyk || false }}

jobs:
  # 1. Pipeline Initialization & Variable Setup
  init:
    runs-on: devops-end2end-runners
    outputs:
      project: ${{ steps.vars.outputs.PROJECT }}
      version: ${{ steps.vars.outputs.VERSION }}
      major_minor: ${{ steps.vars.outputs.MAJOR_MINOR_VER }}
      base_image: ${{ steps.vars.outputs.BASE_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Calculate Environment Variables
        id: vars
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_NAME="${GITHUB_REF_NAME}"

          # Extract version from pyproject.toml (PEP 621 or Poetry) or fallback to setup.py
          if [ -f pyproject.toml ]; then
            MAJOR_MINOR=$(python -c 'import tomllib; f=open("pyproject.toml","rb"); data=tomllib.load(f); print(data.get("project",{}).get("version") or data.get("tool",{}).get("poetry",{}).get("version","0.1.0"))')
          elif [ -f setup.py ]; then
            MAJOR_MINOR=$(python setup.py --version)
          else
            MAJOR_MINOR="0.1.0"
          fi
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}"
          else
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}-${BRANCH_NAME//\//-}"
          fi

          # Determine base image - Use input if provided, otherwise default to upstream official python image
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_IMAGE="${{ inputs.base_image }}"
          else
            BASE_IMAGE="python:${PY_VER}"
          fi

          echo "PROJECT=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "MAJOR_MINOR_VER=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BASE_IMAGE=$BASE_IMAGE" >> $GITHUB_OUTPUT

  # 2. Unit Tests
  unit-tests:
    needs: init
    runs-on: devops-end2end-runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Run Pytest
        run: |
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          export PYTHONPATH="src/main/python:src/test/python"

          # Install deps
          if [ -f pyproject.toml ]; then
            pip install .[dev]
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt pytest-cov
          fi

          # Run pytest
          if [ -d tests ]; then
            pytest tests/ --cov=app --cov-report=term --cov-report xml:coverage.xml
          else
            pytest src/test/python --cov=src/main/python --cov-report=term --cov-report xml:coverage.xml
          fi

      - name: Upload Coverage Artifact
        if: ${{ env.DISABLE_SONARQUBE == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # 3. SonarQube Scan (Conditional)
  sonar-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_sonarqube == false && needs.init.outputs.disable_sonarqube != 'true' }}
    runs-on: devops-end2end-runners
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=admarketplace_${{ needs.init.outputs.project }}
            -Dsonar.projectName=${{ needs.init.outputs.project }}
            -Dsonar.projectVersion=${{ needs.init.outputs.version }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=src/main/python
            -Dsonar.organization=admarketplace

  # 4. Snyk Scan (Conditional)
  snyk-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_snyk == false && needs.init.outputs.disable_snyk != 'true' }}
    runs-on: devops-end2end-runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          pip install snyk
          snyk auth $SNYK_TOKEN
          snyk test --file=requirements.txt

  # 5. Build Packaging Artifacts and Push Docker Image to ECR
  build-and-push:
    needs: [init, unit-tests]
    runs-on: devops-end2end-runners
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-output.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Package Application
        run: |
          if [ -f Dockerfile ]; then
            echo "Custom Dockerfile detected. Skipping legacy packaging."
            exit 0
          fi
          mkdir -p libs/python target
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -t ./libs/python
          elif [ -f pyproject.toml ]; then
            pip install . -t ./libs/python
          fi
          if [ -d src/main ]; then
            cp -rv src/main/* target/
          elif [ -d app ]; then
            cp -rv app target/
          fi
          [ -d confs ] && cp -r confs target/
          [ -d scripts ] && cp -r scripts target/
          cd target
          tar --exclude="__init__.py" -czvf "${{ needs.init.outputs.project }}-${{ needs.init.outputs.version }}.tar.gz" *
          cd ..

      - name: Ensure Dockerfile Exists
        env:
          PROJECT: ${{ needs.init.outputs.project }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No local Dockerfile found. Baking default into the workspace..."
            cat << "EOF" > Dockerfile
          # Utilizing the dynamically injected BASE_IMAGE (defaults to upstream if not explicitly provided)
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}

          ARG DESCRIPTION
          ARG VERSION
          LABEL com.admarketplace.maintainer=ci@admarketplace.com
          LABEL com.admarketplace.description=${DESCRIPTION}
          LABEL com.admarketplace.version=${VERSION}

          LABEL com.datadoghq.tags.service=${PROJECT}
          LABEL com.datadoghq.tags.version=${VERSION}
          ENV DD_SERVICE ${PROJECT}
          ENV DD_VERSION ${VERSION}

          ARG USER=jobuser
          ARG GROUP=ampdev
          ARG PROJECT
          ENV PYTHONPATH="/app/libs/python"
          ENV PROJECT=${PROJECT}
          ENV PROJECT_ACTIVE_DIR=/app

          # Cleaned up FROM prefix, and added groupadd/useradd to ensure compatibility when using standard upstream images
          RUN find /etc/apt/sources.list.d/ -name '*.sources' -exec sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirrors.mit.edu/ubuntu|g;s|http://security.ubuntu.com/ubuntu|http://mirrors.mit.edu/ubuntu|g' {} + 2>/dev/null || true && \
              find /etc/apt/sources.list.d/ -iname '*deadsnakes*' -delete 2>/dev/null || true && \
              rm -rf /var/lib/apt/lists/ppa.launchpadcontent.net* 2>/dev/null || true && \
              apt-get update && apt-get install -y git && \
              groupadd -f $GROUP || true && \
              useradd -m -g $GROUP $USER || true

          WORKDIR /app

          CMD scripts/run.sh

          RUN mkdir logs data
          COPY libs libs
          COPY target/${PROJECT}-${VERSION}.tar.gz .
          RUN tar -xvf ${PROJECT}-${VERSION}.tar.gz && \
              rm -f ${PROJECT}-${VERSION}.tar.gz && \
              chmod +x /app/scripts/* && \
              chown -R $USER:$GROUP /app/*
          USER $USER
          EOF
          else
            echo "Local Dockerfile found. Bypassing baked-in fallback."
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::932399238655:role/github-actions-ecr-role"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        env:
          VERSION: ${{ needs.init.outputs.version }}
          BASE_IMAGE: ${{ needs.init.outputs.base_image }}
          PROJECT: ${{ needs.init.outputs.project }}
          DESCRIPTION: ${{ needs.init.outputs.description }}
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:$VERSION
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.ecr-repository }}
          cache-to: type=gha,scope=${{ inputs.ecr-repository }},mode=min
          build-args: |
            VERSION=$VERSION
            BASE_IMAGE=$BASE_IMAGE
            PROJECT=$PROJECT
            DESCRIPTION=$DESCRIPTION

      - name: Set Image Output
        id: build-output
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ needs.init.outputs.project }}:${{ needs.init.outputs.version }}" >> $GITHUB_OUTPUT
