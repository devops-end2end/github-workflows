name: Reusable Python Docker Build & Push

on:
  workflow_call:
    inputs:
      py_version:
        description: "Python Version"
        required: false
        default: "3.11"
        type: string
      description:
        description: "Description of the application"
        required: false
        type: string
      base_image:
        description: "Override base docker image"
        required: false
        type: string
      aws_region:
        description: "AWS Region"
        required: false
        type: string
        default: "us-east-1"
      disable_sonarqube:
        description: "Disable SonarQube Scan"
        type: boolean
        default: true
      disable_snyk:
        description: "Disable Snyk Scan"
        type: boolean
        default: true
    outputs:
      image:
        description: "The built container image tag"
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  # 1. Pipeline Initialization & Variable Setup
  init:
    runs-on: devops-end2end-runners
    outputs:
      project_name: ${{ steps.vars.outputs.PROJECT_NAME }}
      version: ${{ steps.vars.outputs.VERSION }}
      base_image: ${{ steps.vars.outputs.BASE_IMAGE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.py_version }}

      - name: Calculate Environment Variables
        id: vars
        shell: bash
        run: |
          PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          BRANCH_NAME="${GITHUB_REF_NAME}"

          # Extract version from pyproject.toml (PEP 621 or Poetry) or fallback to setup.py
          if [ -f pyproject.toml ]; then
            MAJOR_MINOR=$(python -c 'import tomllib; f=open("pyproject.toml","rb"); data=tomllib.load(f); print(data.get("project",{}).get("version") or data.get("tool",{}).get("poetry",{}).get("version","0.1"))')
          elif [ -f setup.py ]; then
            MAJOR_MINOR=$(python setup.py --version)
          else
            MAJOR_MINOR="0.1"
          fi

          if [ -z "$MAJOR_MINOR" ] || [ "$MAJOR_MINOR" = "version" ]; then
            MAJOR_MINOR="0.1"
          fi

          # Enforce strict MAJOR.MINOR standard
          IFS='.' read -r -a VERSION_PARTS <<< "$MAJOR_MINOR"
          if [ "${#VERSION_PARTS[@]}" -gt 2 ]; then
            echo "::error::Invalid version format '${MAJOR_MINOR}' detected. Platform compliance requires version to be strictly MAJOR.MINOR (e.g., '0.1')."
            exit 1
          fi

          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}"
          else
            VERSION="${MAJOR_MINOR}.${BUILD_NUM}-${BRANCH_NAME//\//-}"
          fi

          # Determine base image - Use input if provided, otherwise default to Amazon Linux 2023 minimal
          if [ -n "${{ inputs.base_image }}" ]; then
            BASE_IMAGE="${{ inputs.base_image }}"
          else
            BASE_IMAGE="public.ecr.aws/amazonlinux/amazonlinux:2023-minimal"
          fi

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BASE_IMAGE=$BASE_IMAGE" >> $GITHUB_OUTPUT

  # 2. Unit Tests
  unit-tests:
    needs: init
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.py_version }}

      - name: Run Pytest
        run: |
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          export PYTHONPATH="src/main/python:src/test/python"

          # Install deps
          if [ -f pyproject.toml ]; then
            pip install .[dev]
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt pytest-cov
          fi

          # Run pytest
          if [ -d tests ]; then
            pytest tests/ --cov=app --cov-report=term --cov-report xml:coverage.xml
          else
            pytest src/test/python --cov=src/main/python --cov-report=term --cov-report xml:coverage.xml
          fi

      - name: Upload Coverage Artifact
        if: ${{ inputs.disable_sonarqube == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # 3. SonarQube Scan (Conditional)
  sonar-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_sonarqube == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=admarketplace_${{ needs.init.outputs.project_name }}
            -Dsonar.projectName=${{ needs.init.outputs.project_name }}
            -Dsonar.projectVersion=${{ needs.init.outputs.version }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=src/main/python
            -Dsonar.organization=admarketplace

  # 4. Snyk Scan (Conditional)
  snyk-scan:
    needs: [init, unit-tests]
    if: ${{ inputs.disable_snyk == false }}
    runs-on: devops-end2end-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.py_version }}

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          pip install snyk
          snyk auth $SNYK_TOKEN
          snyk test --file=requirements.txt

  # 5. Build Packaging Artifacts and Push Docker Image to ECR
  build-and-push:
    needs: [init, unit-tests]
    runs-on: devops-end2end-runners
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-output.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.py_version }}

      - name: Package Application
        run: |
          if [ -f Dockerfile ]; then
            echo "Custom Dockerfile detected. Skipping packaging."
            exit 0
          fi
          [ -d confs ] && cp -r confs target/ || true
          [ -d scripts ] && cp -r scripts target/ || true

      - name: Ensure Dockerfile Exists
        env:
          PROJECT_NAME: ${{ needs.init.outputs.project_name }}
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No local Dockerfile found. Baking multi-stage Amazon Linux 2023 default into the workspace..."
            cat << "EOF" > Dockerfile
          # ==========================================
          # Stage 1: Build Dependencies in-container (Amazon Linux 2023)
          # ==========================================
          FROM ${{ needs.init.outputs.base_image }} AS builder
          WORKDIR /build

          # Install python3, pip, git, and build tools via microdnf
          RUN microdnf update -y && \
              microdnf install -y python3 python3-pip shadow-utils git gcc make && \
              microdnf clean all

          # Create isolated virtual environment
          RUN python3 -m venv /opt/venv
          ENV PATH="/opt/venv/bin:$PATH"

          # Copy package specifications for caching
          COPY requirements*.txt* pyproject*.toml* setup*.py* ./

          # Install dependencies inside the target OS
          RUN if [ -f pyproject.toml ]; then \
                  pip install --no-cache-dir --upgrade pip setuptools wheel && \
                  pip install --no-cache-dir .; \
              elif [ -f requirements.txt ]; then \
                  pip install --no-cache-dir --upgrade pip setuptools wheel && \
                  pip install --no-cache-dir -r requirements.txt; \
              fi

          # ==========================================
          # Stage 2: Minimal Runtime Image
          # ==========================================
          FROM ${{ needs.init.outputs.base_image }} AS runtime

          # Ensure python3 is available in the runtime container if base image is minimal
          RUN microdnf update -y && \
              microdnf install -y python3 shadow-utils && \
              microdnf clean all

          LABEL com.datadoghq.tags.service=${{ needs.init.outputs.project_name }}
          LABEL com.datadoghq.tags.version=${{ needs.init.outputs.version }}

          ENV DD_SERVICE=${{ needs.init.outputs.project_name }}
          ENV DD_VERSION=${{ needs.init.outputs.version }}
          ENV PROJECT_NAME=${{ needs.init.outputs.project_name }}
          ENV PROJECT_ACTIVE_DIR=/app
          ENV PATH="/opt/venv/bin:$PATH"
          ENV PYTHONDONTWRITEBYTECODE=1
          ENV PYTHONUNBUFFERED=1

          RUN addgroup -g 65532 -S nonroot && \
              adduser -u 65532 -S nonroot -G nonroot
          WORKDIR /app

          # Copy isolated virtual environment from builder stage
          COPY --from=builder /opt/venv /opt/venv

          # Copy application source
          COPY . /app/

          RUN mkdir -p logs data && \
              [ -d scripts ] && chmod +x scripts/* || true && \
          RUN chown -R nonroot:nonroot /app
          USER nonroot

          CMD if [ -f scripts/run.sh ]; then \
                  scripts/run.sh; \
              elif [ -d app ]; then \
                  uvicorn app.main:app --host 0.0.0.0 --port 8000; \
              fi
          EOF
          else
            echo "Local Dockerfile found. Bypassing baked-in fallback."
          fi

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: "arn:aws:iam::932399238655:role/github-actions-ecr-role"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver: docker-container

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository || needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository || needs.init.outputs.project_name }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository || needs.init.outputs.project_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.ecr-repository || needs.init.outputs.project_name }}
          cache-to: type=gha,scope=${{ inputs.ecr-repository || needs.init.outputs.project_name }},mode=min
          build-args: |
            VERSION=${{ needs.init.outputs.version }}
            BASE_IMAGE=${{ needs.init.outputs.base_image }}
            PROJECT_NAME=${{ needs.init.outputs.project_name }}
            DESCRIPTION=${{ inputs.description || needs.init.outputs.project_name }}

      - name: Set Image Output
        id: build-output
        shell: bash
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ needs.init.outputs.project_name }}:${{ needs.init.outputs.version }}" >> $GITHUB_OUTPUT
