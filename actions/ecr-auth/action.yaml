name: "Setup AWS & ECR"
description: "Configures AWS credentials via OIDC and logs into Amazon ECR"


on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS Region"
        required: true
      role-to-assume:
        description: "IAM Role ARN to assume via OIDC"
        required: true

outputs:
  ecr-registry:
    description: "The ECR registry URI"
    value: ${{ steps.login-ecr.outputs.registry }}

runs:
  using: "composite"
  steps:

    - name: Install AWS CLI
      run: |
        sudo apt-get update && sudo apt-get install -y curl unzip
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -q awscliv2.zip
        sudo ./aws/install --update
        rm -rf awscliv2.zip aws

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Get ECR Password
      id: ecr-token
      run: |
        TOKEN=$(aws ecr get-login-password --region ${{ inputs.aws-region }})
        echo "ecr_token=$TOKEN" >> $GITHUB_OUTPUT

    # - name: Log in to Amazon ECR
